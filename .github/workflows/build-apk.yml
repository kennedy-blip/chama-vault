name: Build ChamaVault Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - 'public/downloads/**'
      - 'README.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Web Bundle & Compile Capacitor APK
        run: bash scripts/build-apk.sh

      - name: Upload ChamaVault APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChamaVault-v1.0.0-android-apk
          path: |
            public/downloads/chama-vault.apk
            public/downloads/apk-manifest.json
          retention-days: 90

      - name: Bundle Compiled APK into Web Downloads
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/chama-vault.apk public/downloads/apk-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Bundle compiled ChamaVault v1.0.0 Android APK and SHA-256 manifest [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/downloads/chama-vault.apk
            public/downloads/apk-manifest.json
          generate_release_notes: true
